<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MathShows — ریاضیات با شکل</title>
  <meta name="description" content="مقاله‌های تصویری ریاضیات کامپیوتر و مهندسی">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="./">MathShows</a><span class="meta">ریاضیات با شکل و مثال</span></header>
  <main class="home">
    <h1>مقاله‌ها</h1>
    <p class="meta">هر مقاله یک پوشه در <code>articles/</code> است و در <code>articles.json</code> ثبت می‌شود.</p>
    <div class="cards" id="cards"></div>
  </main>
  <footer class="site-footer"><span>MathShows</span></footer>
  <script>
    // Article list is data-driven: add an entry to articles.json to publish a new article.
    fetch("articles.json").then(r => r.json()).then(list => {
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      document.getElementById("cards").innerHTML = list.map(a => `
        <a class="card" href="articles/${encodeURIComponent(a.slug)}/">
          <h2>${esc(a.title)}</h2>
          <p>${esc(a.summary)}</p>
          <div>${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}<span class="meta">${esc(a.date)}</span></div>
        </a>`).join("");
    });
  </script>
</body>
</html>
